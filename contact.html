<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Portofolio | Contact</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav class="navbar">
            <span class="logo">Yoga Pratama</span>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="porto.html">Porto</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <a href="contact.html" class="button-primary">Let's talk</a>
        </nav>

        <main class="content">
            <h1>Hubungi Saya</h1>
            <p style="color: gray;">Isi form di bawah ini untuk mengirim pesan.</p>

            <form action="#" method="post" class="card">
                <label for="nama">Nama</label>
                <input type="text" id="nama" name="nama" placeholder="Nama kamu" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="email@contoh.com" required>

                <label for="pesan">Pesan</label>
                <textarea id="pesan" name="pesan" rows="5" placeholder="Tulis pesan..."></textarea>

                <button type="submit" class="button-primary">Kirim</button>
            </form>
        </main>

        <footer>
            <p>&copy; 2026 Yoga Pratama</p>
        </footer>
    </body>
</html>
