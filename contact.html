<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hubungi Yoga Pratama">
    <title>Portofolio | Kontak</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">Yoga Pratama</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
                        <li class="nav-item"><a class="nav-link" href="index.html#tentang">Tentang Saya</a></li>
                        <li class="nav-item"><a class="nav-link" href="porto.html">Proyek</a></li>
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="contact.html">Kontak</a></li>
                    </ul>
                    <a href="contact.html" class="btn btn-primary ms-lg-3 mt-2 mt-lg-0">Let's talk</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="py-5">
        <section id="kontak">
            <div class="container content-narrow">
                <h1 class="section-title">Hubungi Saya</h1>
                <p class="text-muted">Isi form di bawah ini untuk mengirim pesan.</p>

                <div class="row g-4">
                    <div class="col-12 col-md-5">
                        <aside class="card shadow-sm h-100">
                            <div class="card-body">
                                <h2 class="h5">Info Kontak</h2>
                                <ul class="list-unstyled mb-0">
                                    <li class="mb-2"><strong>Email:</strong> prtmyog17@gmail.com</li>
                                    <li class="mb-2"><strong>GitHub:</strong> <a href="https://github.com/Yogaprtamaa">Yogaprtamaa</a></li>
                                    <li><strong>Lokasi:</strong> Indonesia</li>
                                </ul>
                            </div>
                        </aside>
                    </div>
                    <div class="col-12 col-md-7">
                        <form action="#" method="post" class="card shadow-sm">
                            <div class="card-body">
                                <div class="mb-3">
                                    <label for="nama" class="form-label">Nama</label>
                                    <input type="text" class="form-control" id="nama" name="nama" placeholder="Nama kamu" required>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" name="email" placeholder="email@contoh.com" required>
                                </div>
                                <div class="mb-3">
                                    <label for="pesan" class="form-label">Pesan</label>
                                    <textarea class="form-control" id="pesan" name="pesan" rows="5" placeholder="Tulis pesan..."></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Kirim</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="text-center py-4">
        <p class="mb-0">&copy; 2026 Yoga Pratama</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
