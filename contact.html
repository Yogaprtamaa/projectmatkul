<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hubungi Yoga Pratama">
    <title>Portofolio | Kontak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    colors: { systemblue: '#007AFF', systemgreen: '#34C759', systemred: '#FF3B30' },
                    fontFamily: { system: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro', 'system-ui', 'Segoe UI', 'sans-serif'] },
                    borderRadius: { apple: '18px' },
                    minHeight: { tap: '44px' },
                    minWidth: { tap: '44px' }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-system">
    <header class="px-4 pt-4">
        <nav class="glass max-w-5xl mx-auto rounded-apple px-4 py-2">
            <div class="flex items-center justify-between min-h-tap">
                <a href="index.html" class="font-bold text-[17px] tracking-tight">Yoga Pratama</a>
                <button id="navToggle" class="lg:hidden min-w-tap min-h-tap flex items-center justify-center rounded-full" aria-label="Toggle navigation" aria-expanded="false">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                </button>
                <div class="hidden lg:flex items-center gap-1">
                    <a href="index.html" class="min-h-tap inline-flex items-center px-4 rounded-full opacity-70 hover:opacity-100">Beranda</a>
                    <a href="index.html#tentang" class="min-h-tap inline-flex items-center px-4 rounded-full opacity-70 hover:opacity-100">Tentang Saya</a>
                    <a href="porto.html" class="min-h-tap inline-flex items-center px-4 rounded-full opacity-70 hover:opacity-100">Proyek</a>
                    <a href="contact.html" aria-current="page" class="min-h-tap inline-flex items-center px-4 rounded-full font-semibold text-systemblue">Kontak</a>
                    <a href="contact.html" class="min-h-tap inline-flex items-center px-6 ml-2 rounded-full bg-systemblue text-white font-semibold">Let's talk</a>
                </div>
            </div>
            <div id="mobileMenu" class="hidden lg:hidden pb-3 flex flex-col gap-1">
                <a href="index.html" class="min-h-tap flex items-center px-4 rounded-xl">Beranda</a>
                <a href="index.html#tentang" class="min-h-tap flex items-center px-4 rounded-xl">Tentang Saya</a>
                <a href="porto.html" class="min-h-tap flex items-center px-4 rounded-xl">Proyek</a>
                <a href="contact.html" aria-current="page" class="min-h-tap flex items-center px-4 rounded-xl font-semibold text-systemblue">Kontak</a>
                <a href="contact.html" class="min-h-tap flex items-center justify-center px-4 rounded-full bg-systemblue text-white font-semibold mt-1">Let's talk</a>
            </div>
        </nav>
    </header>

    <main class="py-10">
        <section id="kontak">
            <div class="max-w-3xl mx-auto px-4">
                <h1 class="text-[34px] leading-[1.15] tracking-[-0.02em] font-bold">Hubungi Saya</h1>
                <p class="text-[15px] opacity-60 mt-1">Isi form di bawah ini untuk mengirim pesan.</p>

                <div class="grid gap-4 md:grid-cols-12 mt-4">
                    <aside class="glass rounded-apple p-4 md:col-span-5 h-full">
                        <h2 class="text-[20px] font-semibold">Info Kontak</h2>
                        <ul class="mt-2 space-y-2 text-[16px]">
                            <li><strong>Email:</strong> prtmyog17@gmail.com</li>
                            <li><strong>GitHub:</strong> <a class="text-systemblue" href="https://github.com/Yogaprtamaa">Yogaprtamaa</a></li>
                            <li><strong>Lokasi:</strong> Indonesia</li>
                        </ul>
                    </aside>
                    <form action="#" method="post" class="glass rounded-apple p-4 md:col-span-7">
                        <div class="mb-4">
                            <label for="nama" class="block text-[16px] font-medium mb-2">Nama</label>
                            <input type="text" class="input-apple w-full min-h-tap rounded-xl px-4 border border-black/10 dark:border-white/20 bg-white dark:bg-black" id="nama" name="nama" placeholder="Nama kamu" required>
                        </div>
                        <div class="mb-4">
                            <label for="email" class="block text-[16px] font-medium mb-2">Email</label>
                            <input type="email" class="input-apple w-full min-h-tap rounded-xl px-4 border border-black/10 dark:border-white/20 bg-white dark:bg-black" id="email" name="email" placeholder="email@contoh.com" required>
                        </div>
                        <div class="mb-4">
                            <label for="pesan" class="block text-[16px] font-medium mb-2">Pesan</label>
                            <textarea class="input-apple w-full rounded-xl px-4 py-3 border border-black/10 dark:border-white/20 bg-white dark:bg-black" id="pesan" name="pesan" rows="5" placeholder="Tulis pesan..."></textarea>
                        </div>
                        <button type="submit" class="w-full min-h-tap rounded-full bg-systemblue text-white font-semibold">Kirim</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="text-center py-8 text-[13px] opacity-60">
        <p>&copy; 2026 Yoga Pratama</p>
    </footer>

    <script>
        const t = document.getElementById('navToggle'), m = document.getElementById('mobileMenu');
        t?.addEventListener('click', () => {
            const open = m.classList.toggle('hidden');
            t.setAttribute('aria-expanded', String(!open));
        });
    </script>
</body>
</html>
